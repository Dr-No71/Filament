name: Windows EXE bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller installieren
        run: python -m pip install --upgrade pyinstaller

      - name: Juno Filament Manager bauen
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FilamentManager --icon assets/juno.ico --add-data "assets/juno_logo.png;assets" --add-data "assets/juno.ico;assets" filament_manager.py

      - name: Windows EXE bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Juno-FilamentManager-V2-Windows
          path: dist/FilamentManager.exe
