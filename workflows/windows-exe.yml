name: Windows EXE bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller installieren
        run: python -m pip install --upgrade pyinstaller

      - name: EXE bauen
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FilamentManager filament_manager.py

      - name: EXE als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FilamentManager-Windows
          path: dist/FilamentManager.exe
